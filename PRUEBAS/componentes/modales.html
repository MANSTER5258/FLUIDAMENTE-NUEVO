<!-- MODALES  PARA ELIMINAR LOS ALERT() -->
    <div id="modal-custom" class="modal-overlay oculta">
        <div class="modal-box">
            <h3 id="modal-titulo" style="margin-bottom: 15px; color: var(--azul-marino);">Título</h3>
            <input type="text" id="modal-input-texto" class="input-form" placeholder="Escribe aquí..." style="margin-bottom: 20px;">
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn-secundario" onclick="cerrarModalCustom()">Cancelar</button>
                <button class="btn-primario" id="modal-btn-confirmar">Aceptar</button>
            </div>
        </div>
    </div>

    <div id="modal-palabra-voz" class="modal-overlay oculta">
        <div class="modal-box" style="text-align: center;">
            <h3 style="color: var(--azul-marino); margin-bottom: 10px;">Pronuncia:</h3>
            <div id="palabra-objetivo-ui" style="font-size: 2.5rem; font-weight: bold; color: var(--cian-brillante); margin: 20px 0;">--</div>
            <div id="modal-palabra-estado" style="font-size: 1.1rem; color: #64748B; margin-bottom: 20px;">Presiona 'Hablar' y dilo en voz alta</div>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-primario" onclick="iniciarMicropalabra()" style="padding: 12px 25px;">🎤 Hablar</button>
                <button class="btn-secundario" onclick="cerrarModalPalabra()">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modal-alerta" class="modal-overlay oculta">
        <div class="modal-box" style="text-align: center;">
            <div id="alerta-icono" style="font-size: 3.5rem; margin-bottom: 15px;">ℹ️</div>
            <div id="alerta-mensaje" style="font-size: 1.15rem; color: var(--azul-marino); margin-bottom: 25px; line-height: 1.5;"></div>
            <button id="btn-alerta-ok" class="btn-primario" style="width: 100%; padding: 12px; font-size: 1.1rem;">Entendido</button>
        </div>
    </div>

    <div id="modal-confirmacion" class="modal-overlay oculta">
        <div class="modal-box" style="text-align: center;">
            <div style="font-size: 3.5rem; margin-bottom: 15px;">⚠️</div>
            <div id="confirmacion-mensaje" style="font-size: 1.15rem; color: var(--azul-marino); margin-bottom: 25px; line-height: 1.5;"></div>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-secundario" onclick="cerrarModalConfirmacion()" style="flex: 1;">Cancelar</button>
                <button id="btn-confirmacion-ok" class="btn-primario" style="flex: 1; background-color: var(--rojo-alerta); box-shadow: 0 3px 0 #B91C1C;">Sí, Continuar</button>
            </div>
        </div>
    </div>

    <div id="modal-registro-voz" class="modal-overlay oculta">
        <div class="modal-box" style="text-align: center;">
            <div style="font-size: 3.5rem; margin-bottom: 15px;">🎤</div>
            <h3 style="color: var(--azul-marino); margin-bottom: 10px;">Calibración de Voz</h3>
            <p style="margin-bottom: 20px; color: var(--gris-texto);">Acerca el micrófono a <strong id="nombre-alumno-voz"></strong> y pídele que hable o diga su nombre para guardar su frecuencia de voz.</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-secundario" onclick="document.getElementById('modal-registro-voz').classList.add('oculta')" style="flex: 1;">Cancelar</button>
                <button id="btn-grabar-voz" class="btn-primario" style="flex: 1;">Grabar (3 seg)</button>
            </div>
        </div>
    </div>
